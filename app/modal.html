<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 1.5em;
            max-width: 1000px;
            margin: auto;
        }
        button {
            font-size: 1em;
            padding: 5px 20px;
        }
        #backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 0.5;
            display: none;
        }
        #modal {
            position: absolute;
            top: -320px;
            left: 30%;
            width: 40%;
            background: #ddd;
            height: 300px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px #555;
            transition: all 0.5s;
        }
        #modal h2 {
            border-radius: 10px 10px 0 0;
            margin: 0;
            padding: 20px;
            background: #bbb;
            font-size: 1em;
        }
        #modal h2 a {
            float: right;
            text-decoration: none;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Home Page</h1>
    <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Amet eveniet explicabo tempora enim non dolor consequatur adipisci harum, et laudantium? Rerum eligendi sed doloribus at beatae repudiandae dolores ea dolore?
    </p>
    <button onclick="show()">Button</button>

    <div id="backdrop" onclick="hide()"></div>
    <div id="modal">
        <h2>
            Modal Title <a href="#" onclick="hide()">&times;</a>
        </h2>
    </div>

    <script>
        function show() {
            document.querySelector("#backdrop").style.display = "block";
            document.querySelector("#modal").style.top = "15%";
        }

        function hide() {
            document.querySelector("#backdrop").style.display = "none";
            document.querySelector("#modal").style.top = "-320px";
        }
    </script>
</body>
</html>
